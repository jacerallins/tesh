name: Tesh CI

on:
  push:
    branches: [main, feature/voice-pipeline-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --run
      - name: Production build
        run: npm run build

  ios-validate:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build iOS companion without signing
        working-directory: apps/ios
        run: set -o pipefail && xcodebuild -project Tesh.xcodeproj -scheme Tesh -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: apps/ios/xcodebuild.log
          if-no-files-found: warn
